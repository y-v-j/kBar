;  kBar: a polybar for KDE Plasma in the "Midnight Ink" theme of
;  pySysMon, pyQuotes and pyReader, across the top of the screen.
;
;  Launchers, weather location and desktop labels live in kbar.toml.
;  Start or restart the bar with ~/.config/kbar/launch.sh

include-file = launchers.ini

[colors]
; 96% opaque, like the desktop widgets
bg = #F5191926
card = #20202f
edge = #2b2b40
track = #2c2c42
fg = #e8e8f2
label = #9a9ab8
dim = #62627e
sky = #7dd3fc
lavender = #c4b5fd
rose = #f9a8d4
mint = #86efac
butter = #fde68a
coral = #fca5a5

[bar/kbar]
; Across the top of the screen, edge to edge
bottom = false
width = 100%
height = 40
offset-x = 0
offset-y = 0
border-bottom-size = 1
border-bottom-color = ${colors.edge}
background = ${colors.bg}
foreground = ${colors.fg}
line-size = 2
padding-left = 16px
padding-right = 16px
module-margin = 10px
separator = ·
separator-foreground = ${colors.dim}

; text, icons, bold text
font-0 = FantasqueSansM Nerd Font:pixelsize=13;2
font-1 = FantasqueSansM Nerd Font:pixelsize=22;4
font-2 = FantasqueSansM Nerd Font:pixelsize=13:weight=bold;2

modules-left = launcher desktops apps
modules-right = volume brightness network battery date weather privacy power showdesktop

cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true
wm-name = kbar

[settings]
screenchange-reload = true

; ── Left ─────────────────────────────────────────────────────────────────────

; Tux: application menu; right click: KRunner; middle: Overview
[module/launcher]
type = custom/text
format = 
format-font = 2
format-foreground = ${colors.lavender}
click-left = ~/.config/kbar/scripts/menu
click-right = ~/.config/kbar/scripts/kde krunner
click-middle = ~/.config/kbar/scripts/kde overview

; Click a desktop to switch; scroll to cycle; right click: Overview; middle: Grid View
[module/desktops]
type = custom/script
exec = ~/.config/kbar/scripts/desktops.py
tail = true
scroll-up = ~/.config/kbar/scripts/kde desktop-prev
scroll-down = ~/.config/kbar/scripts/kde desktop-next
click-right = ~/.config/kbar/scripts/kde overview
click-middle = ~/.config/kbar/scripts/kde grid

; [module/apps] is generated from kbar.toml into launchers.ini

; ── Right ────────────────────────────────────────────────────────────────────

; Click: mute; scroll: volume; right click: audio settings; middle: next output device
[module/volume]
type = internal/pulseaudio
use-ui-max = false
interval = 5
format-volume = <ramp-volume>%{O4} <label-volume>
ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
ramp-volume-font = 2
ramp-volume-foreground = ${colors.sky}
label-volume = %percentage%%
format-muted = <label-muted>
format-muted-prefix = "󰝟 "
format-muted-prefix-font = 2
format-muted-prefix-foreground = ${colors.coral}
label-muted = muted
label-muted-foreground = ${colors.dim}
click-right = ~/.config/kbar/scripts/launch-app --kcm kcm_pulseaudio
click-middle = ~/.config/kbar/scripts/actions.py sink-next

; Scroll: brightness; click: Night Light on/off; right click: display settings;
; middle: Night Light settings
[module/brightness]
type = custom/script
exec = ~/.config/kbar/scripts/brightness.py
tail = true
scroll-up = ~/.config/kbar/scripts/kde brightness-up
scroll-down = ~/.config/kbar/scripts/kde brightness-down
click-left = ~/.config/kbar/scripts/kde night-light
click-right = ~/.config/kbar/scripts/launch-app --kcm kcm_kscreen
click-middle = ~/.config/kbar/scripts/launch-app --kcm kcm_nightlight

; Click: show the IP address; right click: network settings; middle: Wi-Fi on/off
[module/network]
type = custom/script
exec = ~/.config/kbar/scripts/network.py
tail = true
click-left = ~/.config/kbar/scripts/poke network
click-right = ~/.config/kbar/scripts/launch-app --kcm kcm_networkmanagement
click-middle = ~/.config/kbar/scripts/actions.py wifi-toggle

; Click: battery popup (time left, power, health, power profiles); right click: power settings
[module/battery]
type = custom/script
exec = ~/.config/kbar/scripts/battery.py
tail = true
click-left = ~/.config/kbar/scripts/popup.py battery
click-right = ~/.config/kbar/scripts/launch-app --kcm kcm_powerdevilprofilesconfig

; Click: long format; right click: calendar
[module/date]
type = custom/script
exec = ~/.config/kbar/scripts/date.py
tail = true
click-left = ~/.config/kbar/scripts/poke date
click-right = ~/.config/kbar/scripts/popup.py calendar

; Click: details; right click: forecast; middle: refresh now
[module/weather]
type = custom/script
exec = ~/.config/kbar/scripts/weather.py
tail = true
click-left = ~/.config/kbar/scripts/poke weather
click-middle = ~/.config/kbar/scripts/poke weather refresh
click-right = ~/.config/kbar/scripts/popup.py weather

; Camera and microphone. Click the camera: who is using it; click the mic: mute;
; right click: audio settings
[module/privacy]
type = custom/script
exec = ~/.config/kbar/scripts/privacy.py
tail = true
click-right = ~/.config/kbar/scripts/launch-app --kcm kcm_pulseaudio

; Click: lock / log out / restart / shut down (KDE asks first); right click: lock now
[module/power]
type = custom/text
format = 󰐥
format-font = 2
format-foreground = ${colors.coral}
click-left = ~/.config/kbar/scripts/kde leave
click-right = ~/.config/kbar/scripts/kde lock

; Click: show the desktop; right click: Overview
[module/showdesktop]
type = custom/text
format = 󰍹
format-font = 2
format-foreground = ${colors.label}
click-left = ~/.config/kbar/scripts/kde show-desktop
click-right = ~/.config/kbar/scripts/kde overview
